# Photobleaching-step preset: settings of scripts/bleaching_trace_analysis.py.
preprocessing:
  steps:
    - subtract: {value: mean}
    - gaussian_blur: {sigma: 1.0}
detection:
  method: spotiflow
  spotiflow: {model: general, prob_thresh: 0.5, min_distance: 2}
tracking:
  enabled: true
  search_range: 3.0
  memory: 10
# The minimum track length belongs to the bleaching analysis, not to tracking
# (tracks.csv keeps everything trackpy links); the bleaching analysis will
# carry its own minimum when it is built (phase 4) — nothing is lost here.
measure_on: raw
